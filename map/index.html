<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성수 안전 지도</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a1220;--panel:rgba(11,19,33,.84);--line:rgba(150,180,225,.16);--text:#e9eef6;--muted:#9aabc2;--faint:#6f809a;
  --fire:#ff6b3d;--police:#4c8dff;--med:#35d07f;--crowd:#ffc845;--cctv:#b98cff;--ok:#35d07f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
#map{position:fixed;inset:0;z-index:0}   /* 지도 안 배지(마커)가 패널 위로 올라오지 않게 */
#log{z-index:30}
.pn{position:fixed;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;z-index:5}
#top{left:14px;top:14px;right:14px;display:flex;align-items:center;gap:18px;padding:10px 16px;flex-wrap:wrap}
#top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
#sbox{position:relative;flex:0 1 360px;min-width:220px}#q{width:100%;font:inherit;font-size:13.5px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#q:focus{outline:2px solid #ffd84d;outline-offset:1px}#q::placeholder{color:var(--faint)}
#qres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:rgba(11,19,33,.97);border:1px solid var(--line);border-radius:10px;max-height:360px;overflow:auto;display:none;z-index:40}
#qres.on{display:block}#qres button{display:block;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--text);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px;cursor:pointer}
#qres button:hover,#qres button.on{background:rgba(255,216,77,.12)}#qres small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}#qres em{font-style:normal;color:#ffd84d;font-size:11px;margin-right:6px}
.unit{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;font-size:12.5px;color:var(--text);background:none;border:0;padding:4px 2px;cursor:pointer;border-radius:6px}
.unit:hover{background:rgba(255,255,255,.05)}.unit.on{background:rgba(255,216,77,.16);outline:1px solid rgba(255,216,77,.5)}.unit span:last-child{color:var(--muted);white-space:nowrap}
.shops .udet{display:block}.shops .udet div{display:block;padding:0}.udet{margin:2px 0 6px 8px;padding:7px 9px;border-left:2px solid #ffd84d;font-size:12px;line-height:1.6}.udet b{color:var(--muted);font-weight:600;display:inline-block;min-width:58px}
#top .sub{font-size:12px;color:var(--muted)}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#fcw[hidden]{display:none}#fcw{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}#fcw b{color:var(--text);font-weight:600}
#fc{width:200px;height:28px}#fct{display:flex;justify-content:space-between;width:200px;font-size:10.5px;color:var(--faint)}
#lay{left:50%;transform:translateX(-50%);bottom:72px;width:250px;padding:12px 14px;font-size:13px;display:none}#lay.on{display:block}
#hudL{position:fixed;left:14px;bottom:14px;width:290px;display:flex;flex-direction:column;gap:10px;z-index:4}
#hudR{position:fixed;right:14px;bottom:14px;width:330px;display:flex;flex-direction:column;gap:10px;z-index:4}
body.hudOff #hudL,body.hudOff #hudR,body.cardOn #hudR,body.inc #hudL{display:none}
.hp{background:rgba(10,16,22,.62);border:1px solid rgba(160,200,220,.16);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:11px 13px;color:#e9eef2}
.hp h4{margin:0 0 6px;font-size:11.5px;font-weight:600;color:#8e9aa4;display:flex;justify-content:space-between;gap:8px}.hp h4 em{font-style:normal;color:#6f7c86;font-weight:400}
.hcv{position:relative;height:110px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.hbig{font-size:28px;font-weight:800;line-height:1.05}.hbig small{font-size:12.5px;font-weight:600;color:#8e9aa4;margin-left:4px}
.htag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.hgauge{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:8px}.hgauge i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2ec4b6,#8be8de)}
.hmini{font-size:11.5px;color:#8e9aa4;margin-top:7px}.hmini b{color:#e9eef2}
.hair{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.hair div{background:rgba(255,255,255,.03);border-radius:8px;padding:6px 8px}.hair b{display:block;font-size:17px}.hair span{font-size:10.5px;color:#8e9aa4}
.htr{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:6px}.htr div{background:rgba(255,255,255,.03);border-radius:8px;padding:6px 8px;font-size:12px}.htr b{display:block;font-size:12px;color:#8e9aa4;font-weight:600;margin-bottom:2px}.htr span{display:block}
@media (max-width:1100px){#hudL,#hudR{display:none!important}}
#lay h2,#card h2{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
#lay label{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
#lay label i{width:14px;height:4px;border-radius:2px;display:inline-block}
#lay .seg{display:flex;gap:4px;margin:4px 0 10px}
.seg button,.btn{font:inherit;font-size:12.5px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.seg button.on{background:#e9eef6;color:#0a1220;border-color:#e9eef6;font-weight:700}
.btn:hover{border-color:#9aabc2}.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--crowd);outline-offset:2px}
.btn.fire{border-color:var(--fire);color:#ffd2c2}.btn.crowd{border-color:var(--crowd);color:#ffe9b0}
.btn.crash{border-color:#ff4f6d;color:#ffc6d0}.btn.start{background:#35d07f;border-color:#35d07f;color:#05140b;font-weight:800;padding:8px 16px}
.bdg{font:700 12.5px "Pretendard Variable",Pretendard,sans-serif;color:#fff;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5);border:1.5px solid rgba(255,255,255,.85);cursor:pointer;display:flex;align-items:center;gap:5px;transform:translateY(-14px)}
.bdg i{font-style:normal;font-size:10.5px;opacity:.9;font-weight:800}.bdg.st{background:#00a84d;font-size:14px}.bdg.st.bd{background:#d59400}.bdg.fire{background:#e0402a}.bdg.pol{background:#2f6fe0}.bdg.er{background:#119c8a}
#tl{left:50%;transform:translateX(-50%);top:86px;padding:10px 14px;min-width:520px;max-width:calc(100% - 28px)}
#tl .tlh{display:flex;align-items:baseline;gap:10px;font-size:13px}#tl .tlh b{font-size:14px}#tl .tlh span{color:var(--muted)}#tl .clk{margin-left:auto;font-size:20px;font-weight:800;color:var(--text)!important}#tl .spd{font-size:11px}
#tl ol{display:flex;gap:6px;list-style:none;margin:8px 0 0;padding:0}#tl li{flex:1;border-top:3px solid rgba(255,255,255,.12);padding-top:5px;font-size:12px;color:var(--faint)}
#tl li em{display:block;font-style:normal;font-size:11px}#tl li.done{border-color:#35d07f;color:var(--text)}#tl li.cur{border-color:#ffd84d;color:#ffd84d;font-weight:700}#tl .tln{margin-top:6px;font-size:11px;color:var(--faint)}
.btn.end{background:var(--fire);border-color:var(--fire);color:#160803;font-weight:800;padding:8px 16px}
#card{right:14px;top:104px;width:340px;max-height:calc(100% - 200px);overflow:auto;padding:14px 16px;display:none;font-size:13px}
#card.on{display:block}
#card h3{margin:2px 0 2px;font-size:18px;font-weight:800;line-height:1.3}
#card .addr{color:var(--muted);font-size:12.5px}
#card .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.kv div{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kv b{display:block;font-size:15px}.kv span{font-size:11px;color:var(--muted)}
.sec{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.row span:last-child{color:var(--muted);text-align:right}
.warn{color:var(--fire);font-weight:700}
.vwarn{margin:10px 0 4px;padding:8px 10px;border-radius:8px;background:rgba(224,112,255,.14);border:1px solid rgba(224,112,255,.55);font-size:12.5px;line-height:1.6}.vwarn b{color:#f0b8ff}.vwarn span{color:var(--muted)}
.flr{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;font-size:12.5px;color:var(--text);background:none;border:0;border-bottom:1px solid var(--line);padding:6px 2px;cursor:pointer}
.flr:hover{background:rgba(255,255,255,.04)}.flr.on{background:rgba(255,255,255,.1)}.flr b{font-size:13px}.flr i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.flr span:last-child{color:var(--muted);white-space:nowrap}
.shops{margin:6px 0 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px}.shops div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.shops div span:last-child{color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
.src{font-size:11px;color:var(--faint);line-height:1.5;margin-top:8px}
#ops{left:50%;transform:translateX(-50%);bottom:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 28px)}
#ops .hint{font-size:12.5px;color:var(--muted)}
#log{left:14px;bottom:14px;width:300px;max-height:220px;overflow:auto;padding:10px 12px;font-size:12.5px;display:none}
#log.on{display:block}
#log div{padding:3px 0;border-bottom:1px solid var(--line)}#log em{font-style:normal;color:var(--muted);margin-right:6px}
.maplibregl-popup-content{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font:13px "Pretendard Variable",Pretendard,sans-serif;padding:8px 12px}
.maplibregl-popup-tip{display:none}
.maplibregl-ctrl-attrib{background:rgba(10,18,32,.7)!important;color:var(--faint)!important;font-size:10px}.maplibregl-ctrl-attrib a{color:var(--muted)!important}
@media (max-width:760px){#lay{display:none}#card{left:8px;right:8px;top:auto;bottom:86px;width:auto;max-height:52%}#top{left:8px;right:8px;top:8px;gap:8px}#fcw{display:none!important}#log{left:8px;right:8px;width:auto;bottom:86px;max-height:120px}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="성수동 3차원 지도"></div>

<header id="top" class="pn">
  <div><h1>성수 안전 지도</h1><div class="sub">성수역·연무장길 일대 · 공공데이터</div></div>
  <div id="sbox"><input id="q" type="search" placeholder="건물명·주소·업체명 검색" aria-label="건물명, 도로명·지번 주소, 입주 업체명 검색" autocomplete="off"><div id="qres" role="listbox"></div></div>
  <div class="chip" id="crowd"><span class="dot"></span><span>인파 정보 불러오는 중</span></div>
  <div class="chip" id="wx">날씨 —</div>
</header>

<aside id="lay" class="pn" aria-label="지도 표시">
  <h2>건물 색</h2>
  <div class="seg"><button data-c="mono" class="on">단색</button><button data-c="height">높이</button><button data-c="photo">지붕색</button><button data-c="use">용도</button></div>
  <div id="hleg" hidden style="font-size:11px;color:var(--muted);margin:-4px 0 10px"><div style="height:7px;border-radius:4px;background:linear-gradient(90deg,#24496e,#3f86b8,#2ec4b6,#ffcf4a,#ff8a5b,#ff5a7a)"></div><div style="display:flex;justify-content:space-between"><span>0m</span><span>15</span><span>30</span><span>60</span><span>90m</span></div></div>
  <h2>표시</h2>
  <label><input type="checkbox" data-l="ortho" checked> 항공사진 바닥</label>
  <label><input type="checkbox" data-l="nar" checked><i style="background:var(--fire)"></i> 소방차 진입 어려운 길</label>
  <label><input type="checkbox" data-l="jam" checked><i style="background:var(--crowd)"></i> 인파가 몰릴 수 있는 골목</label>
  <label><input type="checkbox" data-l="shop" checked><i style="background:#ff8a5b"></i> 1층 가게(업종별 색)</label>
  <label><input type="checkbox" data-l="l-b"> 건물 이름(전체)</label>
  <label><input type="checkbox" data-l="fw" checked><i style="background:#ff5a4a"></i> 소화전·소방용수시설</label>
  <label><input type="checkbox" data-l="eh" checked><i style="background:#ffb03b"></i> 비상소화장치</label>
  <label><input type="checkbox" data-l="aed" checked><i style="background:#2fe08a"></i> AED(자동심장충격기)</label>
  <label><input type="checkbox" data-l="vul" checked><i style="background:#e070ff"></i> 재난약자 시설(유치원·노인시설)</label>
  <label><input type="checkbox" data-l="hz" checked><i style="background:#ff3b30"></i> 위험물 시설(주유소·충전소 등)</label>
  <label><input type="checkbox" data-l="fl"><i style="background:#3fa7ff"></i> 과거 침수 흔적</label>
  <label><input type="checkbox" data-l="sz"><i style="background:#ffe14d"></i> 어린이보호구역 학교</label>
  <label><input type="checkbox" data-l="bell" checked><i style="background:#3fd2ff"></i> 안전비상벨</label>
  <label><input type="checkbox" data-l="cctv"><i style="background:var(--cctv)"></i> CCTV</label>
  <label><input type="checkbox" data-l="base" checked><i style="background:var(--police)"></i> 소방·경찰·응급실</label>
  <label><input type="checkbox" data-l="shel"><i style="background:var(--med)"></i> 대피 장소(지진옥외·임시주거)</label>
  <label><input type="checkbox" data-l="tr" checked><i style="background:#ffffff"></i> 지하철역·출구</label>
  <label><input type="checkbox" data-l="bus" checked><i style="background:#9be15d"></i> 버스정류장</label>
  <label><input type="checkbox" data-l="prk" checked><i style="background:#4fb3ff"></i> 실시간 주차장</label>
  <label><input type="checkbox" data-l="sign"><i style="background:#ffd84d"></i> 어린이보호구역 표지판</label>
  <p class="src" id="legend"></p>
</aside>

<section id="card" class="pn" aria-live="polite"></section>
<div id="hudL"><div class="hp" id="hP1"><h4>지금 성수카페거리에 있는 사람(추정)<em>불러오는 중</em></h4></div>
  <div class="hp"><h4>12시간 혼잡 예측<em>명(구간 가운데)</em></h4><div class="hcv"><canvas id="hC1"></canvas></div></div>
  <div class="hp"><h4>업종 분포<em id="hCatN"></em></h4><div class="hcv"><canvas id="hC2"></canvas></div></div><div class="hp" id="hP4"><h4>대기·도로<em>불러오는 중</em></h4></div></div>
<div id="hudR"><div class="hp"><h4>성수역 2호선 다음 열차<em id="hTrS">시간표</em></h4><div class="htr" id="hTr"></div><div class="hcv" style="height:80px"><canvas id="hC5"></canvas></div><div class="hmini" id="hBus"></div></div>
  <div class="hp"><h4>건물 주용도<em id="hUseN"></em></h4><div class="hcv"><canvas id="hC3"></canvas></div></div><div class="hp"><h4>전기 사용량 많은 곳<em>건축HUB · kWh</em></h4><div class="hcv"><canvas id="hC4"></canvas></div></div></div>
<section id="log" class="pn" aria-label="훈련 기록"></section>
<section id="tl" class="pn" aria-live="polite" hidden></section>

<nav id="ops" class="pn" aria-label="긴급 상황">
  <span class="hint" id="hint">건물을 누르면 출동 카드가 열립니다</span>
  <button class="btn" id="bLay" aria-expanded="false">지도 표시</button>
  <button class="btn on" id="bHud">HUD 켜짐</button>
  <button class="btn" id="bMenu" aria-expanded="false">훈련</button>
  <span id="emg" hidden><button class="btn fire" data-tr="fire">화재 훈련</button> <button class="btn crowd" data-tr="crowd">인파 밀집 훈련</button> <button class="btn crash" data-tr="crash">교통사고 훈련</button></span>
  <button class="btn start" id="bStart" hidden>▶ 시작</button>
  <button class="btn end" id="bEnd" hidden>■ 종료</button>
</nav>

<script>
const $ = id => document.getElementById(id), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 위쪽 띠 높이가 화면 폭·내용에 따라 바뀌므로, 왼쪽 목록·오른쪽 카드를 그 아래에 붙임
const fitPanels = () => { const t = document.getElementById("top"); if (!t || innerWidth <= 760) return; const b = Math.round(t.getBoundingClientRect().bottom + 10) + "px"; document.getElementById("card").style.top = b; };
addEventListener("resize", fitPanels); new ResizeObserver(fitPanels).observe(document.getElementById("top"));
const SHOPC = { "음식": "#ff8a5b", "소매": "#5bc0ff", "수리·개인": "#c38bff", "교육": "#6fd39a", "부동산": "#ffd166", "예술·스포츠": "#ff6fb5", "보건의료": "#35d07f", "숙박": "#f0b860" };
// 층 용도 색(건축물대장 층별 용도 글자로 나눔)
const FLC = u => /주차/.test(u) ? "#6f7a88" : /아파트형공장|공장|제조/.test(u) ? "#b08ad6" : /사무|업무/.test(u) ? "#6fc3d9" : /근린|소매|판매|음식|휴게|일반음식|제[12]종/.test(u) ? "#f0b860" : /주택|아파트|다가구|다세대|연립|기숙사/.test(u) ? "#8aa3c4" : /기계|전기|창고|저수조|발전/.test(u) ? "#525c6b" : "#9fb0c4";

  if (add.length) logm(`불이 옆 건물로 번짐 · 지금 ${inc.burn.size}동`); const n = inc.burn.size + inc.out.size, c = inc.c;
  const LV = [[3, "대응 1단계", 2], [8, "대응 2단계", 3], [20, "대응 3단계", 3]];
  for (let k = inc.lv; k < LV.length; k++) if (n >= LV[k][0]) { inc.lv = k + 1; const used = new Set(veh.map(v => v.n)), more = near(c, "소방", 20).filter(b => !used.has(b.n)).slice(0, LV[k][2]);
    logm(`<span class="warn">${LV[k][1]} 발령</span> · 번진 건물 ${n}동 · 추가 출동 ${more.length}곳`); dispatch(more, c, "#ff9a3d", "추가 펌프차", () => stage(3, null)); } }

// ── 인파 밀집: 주변 길에서 명소로 사람 유입(점 이동) · 반경 40m 안 인원으로 단계(가정: 60 주의·120 경계·180 위험) · 경찰 도착 → 통제(유입 차단, 흩어짐) → 해소(60 미만)
function crowdStart() { const c = inc.c; inc.ppl = []; inc.spawn = true; inc.note = "유입 속도·단계 기준 인원(반경 40m 안 60·120·180명)·통제 효과는 가정값";
  const src = NODES.map((n, i) => [n, i]).filter(([n, i]) => ADJ[i].length && dist(n, c) > 150 && dist(n, c) < 450); inc.src = src.length ? src : NODES.map((n, i) => [n, i]);
  stage(0, `<b>인파 증가</b> · ${esc(inc.name)}${LIVE ? " · 성수카페거리 실시간 " + esc(LIVE.lvl) : ""}`);
  const pv = spTree(nearNode(c)); inc.acc = 0;   // 명소 쪽 최단 경로 나무를 한 번만 계산
  inc.step = ds => { if (inc.spawn) { inc.acc += ds * 3; while (inc.acc >= 1) { inc.acc -= 1; const [, si] = inc.src[Math.floor(Math.random() * inc.src.length)], P = [...pathFrom(pv, si), [c[0] + (Math.random() - 0.5) * 0.0006, c[1] + (Math.random() - 0.5) * 0.0005]];
      inc.ppl.push({ P, L: lenOf(P), s: 0, sp: 1 + Math.random() * 0.5, out: false }); } }
    for (const q of inc.ppl) q.s += q.sp * ds * (q.out ? -1 : 1);
    inc.ppl = inc.ppl.filter(q => q.s > 0 || !q.out); const near40 = inc.ppl.filter(q => q.s >= q.L[q.L.length - 1] - 40).length; inc.n = near40;
    map.getSource("ppl").setData({ type: "FeatureCollection", features: inc.ppl.map(q => ({ type: "Feature", geometry: { type: "Point", coordinates: at(Object.assign({}, q, { s: Math.max(0, q.s) })) }, properties: {} })) });
    if (near40 >= 120) stage(1, `<span class="warn">경계</span> · 반경 40m 안 약 ${near40}명`);
    if (near40 >= 180 && inc.st[2] == null) { stage(2, `<span class="warn">위험 · 밀집 사고 우려</span> · 약 ${near40}명 · 경찰·구급 출동`); const er = near(c, "병원", 1)[0];
      dispatch(near(c, "경찰", 2), c, "#4c8dff", "경찰", () => { if (inc.st[3] == null) { stage(3, `<b>현장 통제 시작</b> · 유입 차단, 분산 유도`); inc.spawn = false; for (const q of inc.ppl) q.out = true; } });
      dispatch(near(c, "소방", 2), c, "#35d07f", "구급차", v => { if (!er || v.back) return; v.back = true; after(120, () => { logm(`${esc(v.n)} 구급차 → ${esc(er.n)} 이송`); const P = routeTo(c, er.c); Object.assign(v, { P, L: lenOf(P), s: 0, arr: 0, label: "구급차(이송)", done: null }); }); }); }
    if (inc.st[3] != null && near40 < 60 && inc.st[4] == null) stage(4, `<b>해소</b> · 반경 40m 안 약 ${near40}명 · 위험 발령부터 ${mmss(simT - inc.st[2])}`); };
  inc.pulse = now => { const n = inc.n || 0, col = n >= 180 ? "#ff4f4f" : n >= 120 ? "#ff9a3d" : n >= 60 ? "#ffc845" : "#35d07f"; map.getSource("fx").setData({ type: "FeatureCollection", features: [ring(c, 40 + 8 * Math.sin(now / 300), col)] }); }; }

// ── 교통사고: 도로 위 지점 · 경찰 1, 구급 1 출동 · 도착 뒤 처리 10분, 이송(가정) · 정상화
function crashStart() { const c = inc.c; inc.note = "출동 구성(경찰 1·구급 1)과 사고 처리 시간 10분은 가정값";
  stage(0, `<b>교통사고 발생</b> · ${esc(inc.name)}`); after(30, () => { stage(1, "112·119 신고 접수 · 출동");
    const er = near(c, "병원", 1)[0], pol = near(c, "경찰", 1), amb = near(c, "소방", 1); let n = 0;
    const arrive = () => { if (++n < 2 && inc.st[2] == null) { stage(2, "<b>첫 차량 현장 도착</b>"); return; } stage(2, null); stage(3, "<b>사고 처리 시작</b> · 차로 통제"); after(600, () => stage(4, `<b>도로 정상화</b> · 사고부터 ${mmss(simT)}`)); };
    dispatch(pol, c, "#4c8dff", "순찰차", arrive);
    dispatch(amb, c, "#35d07f", "구급차", v => { arrive(); if (!er) return; after(180, () => { logm(`${esc(v.n)} 구급차 → ${esc(er.n)} 이송`); const P = routeTo(c, er.c); Object.assign(v, { P, L: lenOf(P), s: 0, arr: 0, label: "구급차(이송)", done: null }); }); }); });
  if (SAFE) { const z = SAFE.sz.features.map(f => ({ n: f.properties.n, d: dist(c, f.geometry.coordinates) })).filter(x => x.d < 300); if (z.length) logm(`<span class="warn">어린이보호구역 근처 · ${z.map(x => esc(x.n) + " " + Math.round(x.d) + "m").join(", ")} (반경 300m 기준)</span>`); }
  const rd = roadAt(c); if (rd) logm(`사고 도로: ${esc(rd.n || "이름 없는 길")} · 폭 ${rd.w}m${rd.w < 4 ? ' <span class="warn">소방차 진입 어려움</span>' : ""}`);
  inc.pulse = now => map.getSource("fx").setData({ type: "FeatureCollection", features: [ring(c, 22 + 6 * Math.sin(now / 200), "#ff4f6d")] }); }

// 3) 종료: 차량·표시 정리, 결과 한 줄 남김
function endIncident() { if (!inc) return; const S = STAGES[inc.kind], last = inc.cur >= 0 ? S[inc.cur] : "-";
  if (inc.burn) for (const i of [...inc.burn, ...inc.out]) map.setFeatureState({ source: "b", id: i }, { fire: false });
  veh = []; cancelAnimationFrame(raf); raf = 0; tick.t = 0; for (const s of ["veh", "route", "fx", "ppl"]) map.getSource(s).setData({ type: "FeatureCollection", features: [] }); clearTgt();
  logm(`<b>훈련 종료</b> · ${TR[inc.kind]} · 경과 ${mmss(simT)} · 마지막 단계 「${last}」`); const k = inc.kind; inc = null; tgt = null; tlDraw();
  document.body.classList.remove("inc"); $("bEnd").hidden = true; $("bMenu").hidden = false; arm(null); }

</script>
</body>
