<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브이월드 실사 시험</title>
<!-- 브이월드 WebGL 3D 지도 API 3.0 시험: 성수역 일대 실사 3D + 움직이는 차량 1대 + 위험 반경 1개
     인증키는 vw_key.js(깃에 안 올림)에서 읽음 -->
<script src="vw_key.js"></script>
<script>document.write('<script src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=' + encodeURIComponent(window.VW_KEY || "") + '"><\/script>');</script>
<style>
html,body{margin:0;height:100%;background:#0a1220;color:#e9eef6;font-family:"Malgun Gothic",sans-serif}
#vmap{position:fixed;inset:0}
#info{position:fixed;left:12px;top:12px;z-index:10;background:rgba(11,19,33,.86);border:1px solid rgba(150,180,225,.2);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;max-width:360px}
#info b{font-size:15px}
</style>
</head>
<body>
<div id="vmap"></div>
<div id="info"><b>브이월드 실사 시험</b><br><span id="st">지도 불러오는 중…</span><br><span id="fps"></span></div>
<script>
const T0 = performance.now(), st = m => document.getElementById("st").textContent = m;
window.onerror = (m) => st("오류: " + m);
try {
  const map = new vw.Map();
  map.setOption({ mapId: "vmap", initPosition: new vw.CameraPosition(new vw.CoordZ(127.0556, 37.5395, 650), new vw.Direction(10, -38, 0)), logo: true, navigation: true });
  map.start();
} catch (e) { st("지도 시작 실패: " + e.message); }
// 뷰어가 생기면 차량 1대와 위험 반경 1개를 얹음
const wait = setInterval(() => {
  const V = window.ws3d && ws3d.viewer; if (!V || !window.Cesium) return; clearInterval(wait);
  st(`지도 뜸 · ${((performance.now() - T0) / 1000).toFixed(1)}초`);
  fetch("data.json").then(r => r.json()).then(D => {
    // 연무장길 토막들을 이어 한 줄로(가장 긴 것)
    const road = D.r.features.filter(f => f.properties.n === "연무장길").sort((a, b) => b.geometry.coordinates.length - a.geometry.coordinates.length)[0] || D.r.features[0];
    const P = road.geometry.coordinates.map(c => Cesium.Cartesian3.fromDegrees(c[0], c[1], 2));
    const t0 = Cesium.JulianDate.now(), dur = 40, pos = new Cesium.SampledPositionProperty();
    P.forEach((p, k) => pos.addSample(Cesium.JulianDate.addSeconds(t0, dur * k / (P.length - 1), new Cesium.JulianDate()), p));
    V.clock.startTime = t0.clone(); V.clock.currentTime = t0.clone(); V.clock.stopTime = Cesium.JulianDate.addSeconds(t0, dur, new Cesium.JulianDate()); V.clock.clockRange = Cesium.ClockRange.LOOP_STOP; V.clock.shouldAnimate = true;
    V.entities.add({ position: pos, orientation: new Cesium.VelocityOrientationProperty(pos), box: { dimensions: new Cesium.Cartesian3(5, 2.2, 2.2), material: Cesium.Color.fromCssColorString("#ff6b3d") }, point: { pixelSize: 10, color: Cesium.Color.WHITE, disableDepthTestDistance: Number.POSITIVE_INFINITY } });
    const hot = D.p.features.find(f => f.properties.t === "명소" && /대림창고/.test(f.properties.n)) || D.p.features.find(f => f.properties.t === "명소");
    if (hot) V.entities.add({ position: Cesium.Cartesian3.fromDegrees(hot.geometry.coordinates[0], hot.geometry.coordinates[1]),
      ellipse: { semiMajorAxis: 60, semiMinorAxis: 60, material: Cesium.Color.fromCssColorString("#ffc845").withAlpha(0.3), outline: true, outlineColor: Cesium.Color.fromCssColorString("#ffc845"), heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
      label: { text: hot.properties.n + " · 위험 반경 60m", font: "14px sans-serif", fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 3, style: Cesium.LabelStyle.FILL_AND_OUTLINE, verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -20), disableDepthTestDistance: Number.POSITIVE_INFINITY } });
    st(`지도 뜸 · ${((performance.now() - T0) / 1000).toFixed(1)}초 · 차량 1대(연무장길), 위험 반경 1개`);
  });
}, 300);
setTimeout(() => { if (!(window.ws3d && ws3d.viewer)) st("20초 안에 지도가 뜨지 않음(인증키·도메인 확인 필요)"); }, 20000);
// 화면 속도(초당 장면 수)
let n = 0, t = performance.now(); (function f() { n++; const now = performance.now(); if (now - t > 1000) { document.getElementById("fps").textContent = `초당 ${Math.round(n * 1000 / (now - t))}장면`; n = 0; t = now; } requestAnimationFrame(f); })();
</script>
</body>
</html>
