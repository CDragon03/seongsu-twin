<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성수 안전 지도</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a1220;--panel:rgba(11,19,33,.84);--line:rgba(150,180,225,.16);--text:#e9eef6;--muted:#9aabc2;--faint:#6f809a;
  --fire:#ff6b3d;--police:#4c8dff;--med:#35d07f;--crowd:#ffc845;--cctv:#b98cff;--ok:#35d07f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
#map{position:fixed;inset:0}
.pn{position:fixed;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;z-index:5}
#top{left:14px;top:14px;right:14px;display:flex;align-items:center;gap:18px;padding:10px 16px;flex-wrap:wrap}
#top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
#top .sub{font-size:12px;color:var(--muted)}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#fc{width:180px;height:38px}
#lay{left:14px;top:84px;width:230px;padding:12px 14px;font-size:13px}
#lay h2,#card h2{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
#lay label{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
#lay label i{width:14px;height:4px;border-radius:2px;display:inline-block}
#lay .seg{display:flex;gap:4px;margin:4px 0 10px}
.seg button,.btn{font:inherit;font-size:12.5px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.seg button.on{background:#e9eef6;color:#0a1220;border-color:#e9eef6;font-weight:700}
.btn:hover{border-color:#9aabc2}.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--crowd);outline-offset:2px}
.btn.fire{border-color:var(--fire);color:#ffd2c2}.btn.crowd{border-color:var(--crowd);color:#ffe9b0}
.btn.end{background:var(--fire);border-color:var(--fire);color:#160803;font-weight:800;padding:8px 16px}
#card{right:14px;top:84px;width:340px;max-height:calc(100% - 200px);overflow:auto;padding:14px 16px;display:none;font-size:13px}
#card.on{display:block}
#card h3{margin:2px 0 2px;font-size:18px;font-weight:800;line-height:1.3}
#card .addr{color:var(--muted);font-size:12.5px}
#card .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.kv div{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kv b{display:block;font-size:15px}.kv span{font-size:11px;color:var(--muted)}
.sec{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.row span:last-child{color:var(--muted);text-align:right}
.warn{color:var(--fire);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
.src{font-size:11px;color:var(--faint);line-height:1.5;margin-top:8px}
#ops{left:50%;transform:translateX(-50%);bottom:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 28px)}
#ops .hint{font-size:12.5px;color:var(--muted)}
#log{left:14px;bottom:14px;width:300px;max-height:220px;overflow:auto;padding:10px 12px;font-size:12.5px;display:none}
#log.on{display:block}
#log div{padding:3px 0;border-bottom:1px solid var(--line)}#log em{font-style:normal;color:var(--muted);margin-right:6px}
.maplibregl-popup-content{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font:13px "Pretendard Variable",Pretendard,sans-serif;padding:8px 12px}
.maplibregl-popup-tip{display:none}
.maplibregl-ctrl-attrib{background:rgba(10,18,32,.7)!important;color:var(--faint)!important;font-size:10px}.maplibregl-ctrl-attrib a{color:var(--muted)!important}
@media (max-width:760px){#lay{display:none}#card{left:8px;right:8px;top:auto;bottom:86px;width:auto;max-height:52%}#top{left:8px;right:8px;top:8px;gap:8px}#fc{display:none}#log{left:8px;right:8px;width:auto;bottom:86px;max-height:120px}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="성수동 3차원 지도"></div>

<header id="top" class="pn">
  <div><h1>성수 안전 지도</h1><div class="sub">성수역·연무장길 일대 · 공공데이터</div></div>
  <div class="chip" id="crowd"><span class="dot"></span><span>인파 정보 불러오는 중</span></div>
  <div class="chip" id="wx">날씨 —</div>
  <canvas id="fc" aria-label="성수카페거리 인파 예측"></canvas>
</header>

<aside id="lay" class="pn" aria-label="지도 표시">
  <h2>건물 색</h2>
  <div class="seg"><button data-c="photo" class="on">항공사진 지붕색</button><button data-c="use">용도</button></div>
  <h2>표시</h2>
  <label><input type="checkbox" data-l="ortho" checked> 항공사진 바닥</label>
  <label><input type="checkbox" data-l="nar" checked><i style="background:var(--fire)"></i> 소방차 진입 어려운 길</label>
  <label><input type="checkbox" data-l="jam" checked><i style="background:var(--crowd)"></i> 인파가 몰릴 수 있는 골목</label>
  <label><input type="checkbox" data-l="cctv"><i style="background:var(--cctv)"></i> CCTV</label>
  <label><input type="checkbox" data-l="base" checked><i style="background:var(--police)"></i> 소방·경찰·응급실</label>
  <label><input type="checkbox" data-l="shel"><i style="background:var(--med)"></i> 대피소</label>
  <label><input type="checkbox" data-l="tr" checked><i style="background:#cfd8e6"></i> 지하철 출구·버스</label>
  <p class="src" id="legend"></p>
</aside>

<section id="card" class="pn" aria-live="polite"></section>
<section id="log" class="pn" aria-label="상황 기록"></section>

<nav id="ops" class="pn" aria-label="긴급 상황">
  <span class="hint" id="hint">건물을 누르면 출동 카드가 열립니다</span>
  <button class="btn fire" id="bFire">화재 발생</button>
  <button class="btn crowd" id="bCrowd">인파 사고</button>
  <button class="btn end" id="bEnd" hidden>상황 종료</button>
</nav>

<script>
const $ = id => document.getElementById(id), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const USEC = { "주거": "#8aa3c4", "상가": "#f0b860", "업무": "#6fc3d9", "공장·창고": "#b08ad6", "위험물": "#ff5a4a", "기타": "#7d8796" };
const R = 6371000, dist = (a, b) => { const r = Math.PI / 180, x = (b[0] - a[0]) * r * Math.cos((a[1] + b[1]) / 2 * r), y = (b[1] - a[1]) * r; return Math.hypot(x, y) * R; };
const SPEED = { 소방: 30, 경찰: 30, 병원: 30 }; // km/h 가정(도심 긴급차량 평균)
let D, map, sel = null, mode = null, inc = null, veh = [], raf = 0;

const map0 = () => new maplibregl.Map({ container: "map", style: "https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json",
  center: D.center, zoom: 16.4, pitch: 58, bearing: -28, maxPitch: 75, antialias: true, localIdeographFontFamily: "'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif",
  attributionControl: { customAttribution: "건물 국토교통부 · 항공사진 국토지리정보원 · 배경 © CARTO © OpenStreetMap" } });

(async () => {
  D = await (await fetch("data.json")).json();
  map = map0(); map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
  map.on("load", setup);
  live();
})();

function setup() {
  const fnt = ["Montserrat Medium"];
  map.addSource("ortho", { type: "image", url: "ortho.jpg", coordinates: D.ortho });
  map.addLayer({ id: "ortho", type: "raster", source: "ortho", paint: { "raster-opacity": 0.92, "raster-brightness-max": 0.78, "raster-saturation": -0.25, "raster-contrast": 0.05 } });
  map.addSource("r", { type: "geojson", data: D.r });
  map.addSource("b", { type: "geojson", data: D.b, promoteId: "i" });
  map.addSource("via", { type: "geojson", data: D.via });
  map.addSource("p", { type: "geojson", data: D.p });
  map.addSource("jam", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addSource("fx", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addSource("veh", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addSource("ent", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "nar", type: "line", source: "r", filter: ["==", ["get", "nar"], 1], paint: { "line-color": "#ff6b3d", "line-width": ["interpolate", ["linear"], ["zoom"], 15, 1.5, 18, 5], "line-dasharray": [1.2, 1], "line-opacity": 0.95 } });
  map.addLayer({ id: "jam", type: "line", source: "jam", paint: { "line-color": "#ffc845", "line-width": ["interpolate", ["linear"], ["zoom"], 15, 2, 18, 7], "line-opacity": ["get", "o"], "line-blur": 1 } });
  map.addLayer({ id: "route", type: "line", source: "route", paint: { "line-color": ["get", "c"], "line-width": 3, "line-opacity": 0.85, "line-dasharray": [2, 1.2] } });
  map.addLayer({ id: "fx", type: "circle", source: "fx", paint: { "circle-radius": ["get", "r"], "circle-color": ["get", "c"], "circle-opacity": 0.18, "circle-stroke-color": ["get", "c"], "circle-stroke-width": 2, "circle-pitch-alignment": "map" } });
  map.addLayer({ id: "b", type: "fill-extrusion", source: "b", paint: {
    "fill-extrusion-color": ["case", ["boolean", ["feature-state", "fire"], false], "#ff5a2e", ["boolean", ["feature-state", "sel"], false], "#ffffff", ["get", "rc"]],
    "fill-extrusion-height": ["get", "h"], "fill-extrusion-base": 0, "fill-extrusion-opacity": 0.96, "fill-extrusion-vertical-gradient": true } });
  map.addLayer({ id: "via", type: "fill-extrusion", source: "via", paint: { "fill-extrusion-color": "#8a9a92", "fill-extrusion-base": 7.5, "fill-extrusion-height": 9.5, "fill-extrusion-opacity": 0.85 } });
  map.addLayer({ id: "ent", type: "circle", source: "ent", paint: { "circle-radius": 6, "circle-color": "#35d07f", "circle-stroke-color": "#0a1220", "circle-stroke-width": 2 } });
  const P = (id, t, c, r, minz = 14) => map.addLayer({ id, type: "circle", source: "p", minzoom: minz, filter: Array.isArray(t) ? ["in", ["get", "t"], ["literal", t]] : ["==", ["get", "t"], t],
    paint: { "circle-radius": r, "circle-color": c, "circle-stroke-color": "#0a1220", "circle-stroke-width": 1.5 } });
  P("cctv", "CCTV", "#b98cff", 4, 15); P("shel", "대피", "#35d07f", 6); P("tr", ["출구", "버스"], "#cfd8e6", 4, 16);
  P("base", "소방", "#ff6b3d", 8, 12); P("base2", "경찰", "#4c8dff", 8, 12); P("base3", "병원", "#35d07f", 8, 12);
  P("hot", "명소", "#ffc845", 7, 13);
  map.addLayer({ id: "veh", type: "circle", source: "veh", paint: { "circle-radius": 7, "circle-color": ["get", "c"], "circle-stroke-color": "#ffffff", "circle-stroke-width": 2 } });
  const lab = (id, filter, size, color, minz) => map.addLayer({ id, type: "symbol", source: "p", minzoom: minz, filter,
    layout: { "text-field": ["get", "n"], "text-font": fnt, "text-size": size, "text-offset": [0, 1.1], "text-anchor": "top", "text-max-width": 9 },
    paint: { "text-color": color, "text-halo-color": "#0a1220", "text-halo-width": 1.6 } });
  lab("l-st", ["==", ["get", "t"], "역"], 15, "#ffffff", 12); lab("l-hot", ["==", ["get", "t"], "명소"], 13, "#ffe2a0", 14);
  lab("l-base", ["in", ["get", "t"], ["literal", ["소방", "경찰", "병원"]]], 12, "#d9e2ef", 14.5); lab("l-tr", ["==", ["get", "t"], "출구"], 11, "#cfd8e6", 17.2);
  map.addLayer({ id: "l-road", type: "symbol", source: "r", minzoom: 15.5, filter: ["all", ["!=", ["get", "n"], ""], [">=", ["get", "w"], 6]],
    layout: { "symbol-placement": "line", "text-field": ["get", "n"], "text-font": fnt, "text-size": 12, "symbol-spacing": 420 }, paint: { "text-color": "#c9d3e2", "text-halo-color": "#0a1220", "text-halo-width": 1.6 } });
  map.addLayer({ id: "l-b", type: "symbol", source: "b", minzoom: 17, filter: ["!=", ["get", "n"], ""],
    layout: { "text-field": ["get", "n"], "text-font": fnt, "text-size": 11.5, "text-max-width": 8 }, paint: { "text-color": "#ffffff", "text-halo-color": "#0a1220", "text-halo-width": 1.6 } });
  jamAlleys(); ui(); graph();
  map.on("click", "b", e => { const f = e.features[0]; if (mode === "fire") return startFire(f); openCard(f.properties.i); });
  map.on("click", "hot", e => { if (mode === "crowd") startCrowd(e.features[0]); });
  for (const id of ["cctv", "shel", "tr", "base", "base2", "base3", "hot"]) {
    map.on("click", id, e => { if (mode) return; const p = e.features[0].properties; new maplibregl.Popup({ closeButton: false, offset: 10 }).setLngLat(e.lngLat).setHTML(`<b>${esc(p.n)}</b><br><span style="color:#9aabc2">${esc(p.t)}${p.k ? " · " + esc(p.k) : ""}${p.tel ? " · " + esc(p.tel) : ""}</span>`).addTo(map); });
    map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer"); map.on("mouseleave", id, () => map.getCanvas().style.cursor = ""); }
  map.on("mouseenter", "b", () => map.getCanvas().style.cursor = "pointer"); map.on("mouseleave", "b", () => map.getCanvas().style.cursor = "");
  $("legend").textContent = `건물 ${D.b.features.length.toLocaleString("ko-KR")}동 · 지붕색은 2025 항공사진에서 읽은 색, 벽은 같은 색을 어둡게 칠한 것(실제 벽 색 아님). 진입 어려운 길 = 폭 4m 미만(가정).`;
}

// ── 화면 조작
function ui() {
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { document.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x === b));
    map.setPaintProperty("b", "fill-extrusion-color", ["case", ["boolean", ["feature-state", "fire"], false], "#ff5a2e", ["boolean", ["feature-state", "sel"], false], "#ffffff",
      b.dataset.c === "use" ? ["match", ["get", "g"], ...Object.entries(USEC).flat(), "#7d8796"] : ["get", "rc"]]); });
  const grp = { base: ["base", "base2", "base3", "l-base"], tr: ["tr", "l-tr"] };
  document.querySelectorAll("[data-l]").forEach(c => c.onchange = () => (grp[c.dataset.l] || [c.dataset.l]).forEach(id => map.setLayoutProperty(id, "visibility", c.checked ? "visible" : "none")));
  ["cctv", "shel"].forEach(id => map.setLayoutProperty(id, "visibility", "none"));
  $("bFire").onclick = () => arm("fire"); $("bCrowd").onclick = () => arm("crowd"); $("bEnd").onclick = endIncident;
  addEventListener("keydown", e => { if (e.key === "Escape") { if (inc) endIncident(); else if (mode) arm(null); else closeCard(); } });
}
function arm(m) { if (inc) return; mode = mode === m ? null : m;
  $("hint").textContent = mode === "fire" ? "불이 난 건물을 누르세요 (Esc 취소)" : mode === "crowd" ? "노란 점(인파 명소)을 누르세요 (Esc 취소)" : "건물을 누르면 출동 카드가 열립니다";
  $("bFire").classList.toggle("on", mode === "fire"); $("bCrowd").classList.toggle("on", mode === "crowd"); }

// ── 출동 카드
const near = (c, t, n) => D.base.filter(b => b.t === t && !/수난구조|특수구조|구조대$/.test(b.n)).map(b => ({ ...b, d: dist(c, b.c) })).sort((a, b) => a.d - b.d).slice(0, n);
const eta = (m, t) => Math.max(1, Math.round(m / 1000 / SPEED[t] * 60));
function centroid(f) { const C = f.geometry.coordinates[0]; let x = 0, y = 0; for (const p of C) { x += p[0]; y += p[1]; } return [x / C.length, y / C.length]; }
function roadAt(c) { let best = null; for (const f of D.r.features) { const L = f.geometry.coordinates; for (let k = 1; k < L.length; k++) { const d = segD(c, L[k - 1], L[k]); if (!best || d < best.d) best = { d, w: f.properties.w, n: f.properties.n }; } } return best; }
function segD(p, a, b) { const k = Math.cos(p[1] * Math.PI / 180), ax = (a[0] - p[0]) * k, ay = a[1] - p[1], bx = (b[0] - p[0]) * k, by = b[1] - p[1], dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy, t = l ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l)) : 0; return Math.hypot(ax + dx * t, ay + dy * t) * Math.PI / 180 * R; }
function openCard(i) {
  const f = D.b.features.find(x => x.properties.i === i); if (!f) return; const p = f.properties, c = centroid(f), parse = v => typeof v === "string" ? JSON.parse(v) : v;
  if (sel !== null) map.setFeatureState({ source: "b", id: sel }, { sel: false }); sel = i; map.setFeatureState({ source: "b", id: i }, { sel: true });
  const E = parse(p.e) || [], FL = parse(p.fl) || [], CAT = parse(p.cat) || [], S1 = parse(p.s1) || [];
  map.getSource("ent").setData({ type: "FeatureCollection", features: E.map(e => ({ type: "Feature", geometry: { type: "Point", coordinates: e } })) });
  const rd = roadAt(E[0] || c), fire = near(c, "소방", 2), pol = near(c, "경찰", 1), er = near(c, "병원", 1);
  const fl = {}; for (const [k, u] of FL) (fl[k] = fl[k] || []).push(u);
  $("card").innerHTML = `<button class="x" aria-label="닫기" onclick="closeCard()">×</button>
    <h2>출동 카드</h2><h3>${esc(p.n || p.a || "이름 없는 건물")}</h3><div class="addr">${esc(p.a)}</div>
    <div class="kv"><div><b>${p.fu || "-"}층</b><span>지상</span></div><div><b>${p.fb ? "B" + p.fb : "없음"}</b><span>지하</span></div><div><b>${p.h}m</b><span>높이·${esc(p.hs)}</span></div>
      <div><b>${p.ga ? p.ga.toLocaleString("ko-KR") : "-"}</b><span>연면적 ㎡</span></div><div><b>${esc(p.ap || "-")}</b><span>사용승인</span></div><div><b>${E.length}곳</b><span>출입구</span></div></div>
    <div class="row"><span>용도</span><span>${esc(p.u || "미상")}${p.g === "위험물" ? ' <span class="warn">위험물</span>' : ""}</span></div>
    <div class="row"><span>구조</span><span>${esc(p.st || "-")}</span></div>
    <div class="row"><span>앞 도로</span><span>${rd ? `${esc(rd.n || "이름 없는 길")} · 폭 ${rd.w}m${rd.w < 4 ? ' <span class="warn">소방차 진입 어려움</span>' : ""}` : "-"}</span></div>
    <div class="sec"><h2>가까운 기관 <span class="tag">직선거리 · 도착 ${SPEED.소방}km/h 가정</span></h2>
      ${[...fire, ...pol, ...er].map(b => `<div class="row"><span>${esc(b.n)}</span><span>${(b.d / 1000).toFixed(1)}km · 약 ${eta(b.d, b.t)}분</span></div>`).join("")}</div>
    <div class="sec"><h2>입주</h2><div class="row"><span>상가업소</span><span>${p.sn}곳</span></div>${p.fn ? `<div class="row"><span>등록 공장</span><span>${p.fn}곳</span></div>` : ""}${p.mn ? `<div class="row"><span>현장 확인</span><span>${p.mn}곳</span></div>` : ""}
      ${CAT.length ? `<div class="row"><span>업종</span><span>${CAT.map(([k, n]) => esc(k) + " " + n).join(" · ")}</span></div>` : ""}${S1.length ? `<div class="row"><span>1층</span><span>${S1.map(esc).join(", ")}</span></div>` : ""}</div>
    ${Object.keys(fl).length ? `<div class="sec"><h2>층별 용도</h2>${Object.keys(fl).map(Number).sort((a, b) => b - a).map(k => `<div class="row"><span>${k < 0 ? "지하 " + -k : k}층</span><span>${esc([...new Set(fl[k])].join(", "))}</span></div>`).join("")}</div>` : ""}
    <p class="src">출처: ${esc(D.src.b)} · 출입구 행정안전부 도로명주소 · ${esc(D.src.store)}. 높이 "추정"은 대장에 높이가 없어 층수로 잡은 값.</p>`;
  $("card").classList.add("on"); }
function closeCard() { $("card").classList.remove("on"); if (sel !== null) map.setFeatureState({ source: "b", id: sel }, { sel: false }); sel = null; map.getSource("ent").setData({ type: "FeatureCollection", features: [] }); }

// ── 인파: 명소 150m 안의 폭 6m 미만 골목, 실시간 혼잡도에 따라 진하게
let LIVE = null;
function jamAlleys() { const hot = D.p.features.filter(f => f.properties.t === "명소").map(f => f.geometry.coordinates), lvl = LIVE ? ({ "여유": 0.35, "보통": 0.6, "약간 붐빔": 0.85, "붐빔": 1 }[LIVE.lvl] ?? 0.5) : 0.5;
  const F = D.r.features.filter(f => f.properties.w < 6 && f.geometry.coordinates.some(c => hot.some(h => dist(c, h) < 150))).map(f => ({ ...f, properties: { ...f.properties, o: lvl } }));
  map.getSource("jam").setData({ type: "FeatureCollection", features: F }); }
async function live() {
  const url = /localhost|127\.0\.0\.1/.test(location.hostname) ? "../data/live.json" : "https://raw.githubusercontent.com/CDragon03/seongsu-twin/live/live.json";
  try { const j = await (await fetch(url + "?t=" + Math.floor(Date.now() / 300000), { cache: "no-store" })).json(), a = j.areas && j.areas["성수카페거리"]; if (!a) return; LIVE = a;
    const col = { "여유": "#35d07f", "보통": "#ffc845", "약간 붐빔": "#ff9a3d", "붐빔": "#ff5a4a" }[a.lvl] || "#9aabc2";
    $("crowd").innerHTML = `<span class="dot" style="background:${col}"></span><span>성수카페거리 <b>${esc(a.lvl)}</b> · ${Math.round(a.min).toLocaleString("ko-KR")}~${Math.round(a.max).toLocaleString("ko-KR")}명 · ${esc((a.time || "").slice(11))} 기준</span>`;
    if (a.wx) $("wx").textContent = `${a.wx.temp}℃ · ${a.wx.sky || ""}${a.wx.pty && a.wx.pty !== "없음" ? " · " + a.wx.pty : ""} · 미세먼지 ${a.wx.air || "-"}`;
    if (a.fcst && window.Chart) new Chart($("fc"), { type: "line", data: { labels: a.fcst.map(f => f[0].slice(11, 13) + "시"), datasets: [{ data: a.fcst.map(f => f[3]), borderColor: "#ffc845", borderWidth: 2, pointRadius: 0, tension: 0.35, fill: true,
      backgroundColor: c => { const g = c.chart.ctx.createLinearGradient(0, 0, 0, 38); g.addColorStop(0, "rgba(255,200,69,.35)"); g.addColorStop(1, "rgba(255,200,69,0)"); return g; } }] },
      options: { responsive: false, animation: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => "최대 " + c.raw.toLocaleString("ko-KR") + "명" } } }, scales: { x: { display: false }, y: { display: false } } } });
    if (map && map.getSource("jam")) jamAlleys(); else map && map.once("load", jamAlleys);
  } catch (e) { $("crowd").innerHTML = `<span class="dot" style="background:#6f809a"></span><span>실시간 인파 정보를 받지 못했습니다</span>`; } }

// ── 길 그래프(도로구간) + 최단 경로
let NODES = [], ADJ = [];
function graph() { const idx = new Map(), key = c => c[0].toFixed(5) + "," + c[1].toFixed(5), id = c => { const k = key(c); if (!idx.has(k)) { idx.set(k, NODES.length); NODES.push(c); ADJ.push([]); } return idx.get(k); };
  for (const f of D.r.features) { const L = f.geometry.coordinates; for (let k = 1; k < L.length; k++) { const a = id(L[k - 1]), b = id(L[k]), d = dist(L[k - 1], L[k]); ADJ[a].push([b, d]); ADJ[b].push([a, d]); } } }
const nearNode = c => { let b = 0, bd = 1e12; NODES.forEach((n, i) => { const d = dist(c, n); if (d < bd && ADJ[i].length) { bd = d; b = i; } }); return b; };
function path(s, t) { const n = NODES.length, d = new Float64Array(n).fill(Infinity), pv = new Int32Array(n).fill(-1), done = new Uint8Array(n); d[s] = 0;
  for (;;) { let u = -1, m = Infinity; for (let i = 0; i < n; i++) if (!done[i] && d[i] < m) { m = d[i]; u = i; } if (u < 0 || u === t) break; done[u] = 1; for (const [v, w] of ADJ[u]) if (d[u] + w < d[v]) { d[v] = d[u] + w; pv[v] = u; } }
  const P = []; for (let v = t; v >= 0; v = pv[v]) P.push(NODES[v]); return P.reverse(); }
// 구역 밖 기관: 기관 → 구역 가장자리에서 가장 가까운 길 끝까지 곧게, 그다음 길을 따라
function routeTo(from, to) { const s = nearNode(from), t = nearNode(to), P = path(s, t); return [from, ...P, to]; }
const lenOf = P => { let L = [0]; for (let k = 1; k < P.length; k++) L.push(L[k - 1] + dist(P[k - 1], P[k])); return L; };

// ── 긴급 상황
function logm(t) { const now = new Date(); $("log").insertAdjacentHTML("afterbegin", `<div><em>${now.toTimeString().slice(0, 8)}</em>${t}</div>`); $("log").classList.add("on"); }
function begin(kind) { inc = { kind, t0: performance.now() }; mode = null; $("bEnd").hidden = false; $("bFire").disabled = $("bCrowd").disabled = true;
  $("hint").textContent = kind === "fire" ? "화재 대응 중 · 시뮬레이션(차량 대수·속도는 가정)" : "인파 사고 대응 중 · 시뮬레이션(차량 대수·속도는 가정)"; }
function dispatch(list, target, color, label, after) {
  for (const b of list) { const P = routeTo(b.c, target), L = lenOf(P); const v = { P, L, s: 0, c: color, n: b.n, label, d: b.d, after, back: false }; veh.push(v);
    logm(`${esc(b.n)} ${label} 출동 · 길 ${(L[L.length - 1] / 1000).toFixed(1)}km · 약 ${eta(L[L.length - 1], "소방")}분`); }
  map.getSource("route").setData({ type: "FeatureCollection", features: veh.map(v => ({ type: "Feature", geometry: { type: "LineString", coordinates: v.P }, properties: { c: v.c } })) });
  if (!raf) tick(); }
function tick() { const now = performance.now(); const dt = Math.min(0.1, (now - (tick.t || now)) / 1000); tick.t = now;
  const SIM = 12; // 화면 1초 = 12초(빠르게 보기)
  for (const v of veh) { if (v.s >= v.L[v.L.length - 1]) { if (!v.arr) { v.arr = 1; logm(`${esc(v.n)} ${v.label} 현장 도착`); v.after && v.after(v); } continue; } v.s += SPEED.소방 / 3.6 * dt * SIM; }
  map.getSource("veh").setData({ type: "FeatureCollection", features: veh.map(v => ({ type: "Feature", geometry: { type: "Point", coordinates: at(v) }, properties: { c: v.c } })) });
  if (inc && inc.kind && inc.pulse) inc.pulse(now);
  raf = requestAnimationFrame(tick); }
function at(v) { const s = Math.min(v.s, v.L[v.L.length - 1]); let k = 1; while (k < v.L.length - 1 && v.L[k] < s) k++; const a = v.P[k - 1], b = v.P[k], t = (s - v.L[k - 1]) / ((v.L[k] - v.L[k - 1]) || 1); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

function startFire(f) { const p = f.properties, c = centroid(f); begin("fire"); openCard(p.i); map.setFeatureState({ source: "b", id: p.i }, { fire: true }); inc.b = p.i;
  logm(`<b>화재 발생</b> · ${esc(p.n || p.a)} (${p.fu || "?"}층${p.fb ? ", 지하 " + p.fb + "층" : ""})`);
  const rd = roadAt(c); if (rd && rd.w < 4) logm(`<span class="warn">앞 도로 폭 ${rd.w}m · 소방차 진입 어려움</span>`);
  dispatch(near(c, "소방", 3), c, "#ff6b3d", "소방차", null); dispatch(near(c, "경찰", 1), c, "#4c8dff", "순찰차", null);
  inc.pulse = now => map.getSource("fx").setData({ type: "FeatureCollection", features: [{ type: "Feature", geometry: { type: "Point", coordinates: c }, properties: { r: 26 + 10 * Math.sin(now / 260), c: "#ff6b3d" } }] }); }
function startCrowd(f) { const c = f.geometry.coordinates, p = f.properties; begin("crowd");
  logm(`<b>인파 사고</b> · ${esc(p.n)} 앞${LIVE ? " · 성수카페거리 지금 " + esc(LIVE.lvl) : ""}`);
  const er = near(c, "병원", 1)[0];
  dispatch(near(c, "경찰", 2), c, "#4c8dff", "경찰", null);
  dispatch(near(c, "소방", 3), c, "#35d07f", "구급차", v => { if (!er || v.back) return; v.back = true; setTimeout(() => { if (!inc) return; logm(`${esc(v.n)} 구급차 → ${esc(er.n)} 이송`); const P = routeTo(c, er.c); Object.assign(v, { P, L: lenOf(P), s: 0, arr: 0, label: "구급차(이송)", after: null }); }, 1500); });
  inc.pulse = now => map.getSource("fx").setData({ type: "FeatureCollection", features: [{ type: "Feature", geometry: { type: "Point", coordinates: c }, properties: { r: 40 + 14 * Math.sin(now / 300), c: "#ffc845" } }] }); }
function endIncident() { if (!inc) return; const mins = Math.round((performance.now() - inc.t0) / 1000 * 12 / 60);
  if (inc.b !== undefined) map.setFeatureState({ source: "b", id: inc.b }, { fire: false });
  veh = []; cancelAnimationFrame(raf); raf = 0; tick.t = 0;
  for (const s of ["veh", "route", "fx"]) map.getSource(s).setData({ type: "FeatureCollection", features: [] });
  logm(`<b>상황 종료</b> · 경과 약 ${mins}분(시뮬레이션 시간)`); inc = null; $("bEnd").hidden = true; $("bFire").disabled = $("bCrowd").disabled = false; arm(null); }
</script>
</body>
